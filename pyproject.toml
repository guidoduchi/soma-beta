[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soma-beta"
version = "1.0.0.dev0"
description = "SOMA Beta 1.0 local operations platform"
requires-python = ">=3.13,<3.15"
dependencies = [
  "argon2-cffi==25.1.0",
  "starlette==1.6.0",
  "uvicorn==0.52.4",
  "openpyxl==3.1.5",
  "tzdata==2026.4",
  "regex==2026.9.10",
  "unicodedata2==17.0.1",
  "msgforge==1.0.0",
  "compressed-rtf==1.0.7",
  "olefile==0.47",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"soma" = ["schema_manifest.json", "fk_index_exceptions.json"]
"soma.reference.assets" = ["*.json"]
"soma.migrations" = ["*.sql", "manifest.json"]
"soma.infrastructure.contracts" = ["registry.json"]
"soma.communications.contracts" = ["registry.json"]
"soma.ui" = ["registry.json", "static/*", "static/assets/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["soma"]
