[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soma-beta"
version = "1.0.0.dev0"
description = "SOMA Beta 1.0 local operations platform"
requires-python = ">=3.13,<3.15"
dependencies = [
  "regex==2026.9.10",
  "unicodedata2==17.0.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"soma.reference.assets" = ["*.json"]
"soma.migrations" = ["*.sql", "manifest.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["soma"]
