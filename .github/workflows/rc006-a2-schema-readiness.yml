name: RC006 A2 Schema Readiness

on:
  push:
    branches:
      - foundation/product-contract-v0.1
    paths:
      - '.github/workflows/rc006-a2-schema-readiness.yml'
      - 'tools/reconciliation/allocate_rc006_a2_assertions.py'
      - 'docs/reconciliation/RC006_A2_SOURCE_ROLES.tsv'
      - 'docs/reconciliation/RC006_A2_EXTRACTION_SCHEMA.md'
      - 'docs/reconciliation/RC006_A2_ASSERTION_ALLOCATION_STATE.json'
      - 'docs/reconciliation/RC006_A2_ASSERTION_AUTHORITY.jsonl'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check A2-1 zero-allocation readiness
        run: |
          python tools/reconciliation/allocate_rc006_a2_assertions.py \
            --repo . \
            check-state \
            --expect-zero \
            --output rc006_a2_schema_readiness.json

      - name: Show readiness result
        run: cat rc006_a2_schema_readiness.json

      - name: Upload readiness result
        uses: actions/upload-artifact@v4
        with:
          name: rc006-a2-schema-readiness
          path: rc006_a2_schema_readiness.json
          if-no-files-found: error
          retention-days: 90
