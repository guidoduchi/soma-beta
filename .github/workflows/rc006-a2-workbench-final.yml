    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Decode reviewed boundary manifest and verify frontier
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          python - <<'PY'
          import base64,hashlib,json,os,zlib
          from pathlib import Path
          encoded=''.join(os.environ['MANIFEST_ZB64'].split())
          raw=zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest()==os.environ['MANIFEST_SHA256']
          manifest=json.loads(raw.decode('utf-8'))
          assert len(manifest)==211
          Path(os.environ['WORK'],'manifest.json').write_bytes(raw)
          s=json.loads(Path('docs/reconciliation/RC006_A2_ASSERTION_ALLOCATION_STATE.json').read_text())
          assert s['allocated_count']==824 and s['next_assertion_number']==825
          assert s['highest_allocated_assertion_id']=='A2-ASSERT-000824'
          assert s['completed_initial_sources']==[
              'docs/PRODUCT_CONTRACT.md','docs/IMPORT_CONTRACT.md','docs/RFC_WFM_CONTRACT.md'
          ]
          print('MANIFEST_AND_FRONTIER\tPASS')
          PY
          test "$(git rev-parse "$SOURCE_COMMIT:$SOURCE_PATH")" = "$SOURCE_BLOB"
          test ! -e "$CANDIDATE_PATH"

      - name: Generate canonical Workbench candidate corpus
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,subprocess,unicodedata
          from pathlib import Path
          manifest=json.loads(Path(os.environ['WORK'],'manifest.json').read_text(encoding='utf-8'))
          raw=subprocess.check_output(['git','show',f"{os.environ['SOURCE_COMMIT']}:{os.environ['SOURCE_PATH']}"])
          assert b'\r' not in raw
          lines=raw.decode('utf-8').splitlines()
          assert len(lines)==203
          headings=[]
          for n,line in enumerate(lines,1):
              m=re.match(r'^(#{2,3})\s+(.+?)\s*$',line)
              if m:
                  visible=m.group(2)
                  anchor=unicodedata.normalize('NFC',visible).replace('`','').replace('*','').replace('_','').lower()
                  anchor=''.join(ch for ch in anchor if ch.isalnum() or ch in {' ','-'})
                  anchor=re.sub(r' +','-',anchor); anchor=re.sub(r'-+','-',anchor).strip('-')
                  headings.append((n,visible,anchor))
          assert len(headings)==18,headings
          def owner(start):
              h=[x for x in headings if x[0] < start][-1]
              return h[1],h[2],headings.index(h)+1
          def fp(text):
              norm=unicodedata.normalize('NFC',text.replace('\r\n','\n').replace('\r','\n'))
              return hashlib.sha256(norm.encode()).hexdigest()
          per={}; records=[]; mismatches=[]
          for i,item in enumerate(manifest,1):
              start=int(item['start']); end=int(item['end']); exact=item['text']; kind=item['kind']
              assert 1 <= start <= end <= len(lines)
              segment='\n'.join(lines[start-1:end])
              if segment.count(exact)!=1:
                  mismatches.append((i,start,end,exact,segment)); continue
              off=segment.index(exact)
              assert '\n' not in segment[:off]
              assert start+exact.count('\n')==end
              heading,anchor,sec=owner(start)
              ordinal=per.get(sec,0)+1; per[sec]=ordinal
              records.append({
                  'schema':'RC006-A2-ASSERTION-CANDIDATE-V1','source_path':os.environ['SOURCE_PATH'],
                  'source_blob_sha':os.environ['SOURCE_BLOB'],'section_heading':heading,'section_anchor':anchor,
                  'section_ordinal':sec,'assertion_ordinal':ordinal,'source_start_line':start,'source_end_line':end,
                  'exact_text':exact,'fingerprint_sha256':fp(exact),'normative_kind':kind,
                  'classification_review':'PASS',
                  'review_note':'Human boundary review 2026-09-05: retained as one independently reviewable rule or cohesive presentation/behavior contract. Reverse authority disposition tracked by the completed A2 semantic pre-pass.'
              })
          if mismatches:
              for x in mismatches: print('MISMATCH',repr(x))
              raise AssertionError(f'{len(mismatches)} exact-text mismatches')
          assert len(records)==211
          assert sorted(per)==list(range(1,19)),per
          out=b''.join((json.dumps(r,sort_keys=True,separators=(',',':'),ensure_ascii=False)+'\n').encode() for r in records)
          path=Path(os.environ['CANDIDATE_PATH']); path.parent.mkdir(parents=True,exist_ok=True); path.write_bytes(out)
          seq='\n'.join(r['exact_text'] for r in records).encode()
          report={'candidate_count':211,'section_counts':per,'candidate_sha256':hashlib.sha256(out).hexdigest(),'exact_text_sequence_sha256':hashlib.sha256(seq).hexdigest()}
          Path(os.environ['WORK'],'generation.json').write_text(json.dumps(report,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps(report,sort_keys=True))
          PY

      - name: Validate candidate against pinned B002 source
        run: |
          set -euo pipefail
          python tools/reconciliation/allocate_rc006_a2_assertions_v1_1.py --repo . validate-candidates --source-path "$SOURCE_PATH" --candidates "$CANDIDATE_PATH" --output "$WORK/v11.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path(os.environ['WORK'],'v11.json').read_text())
          assert r['result']=='PASS' and r['candidate_count']==211 and r['section_count_with_candidates']==18
          assert r['pinned_source_blob_sha']==os.environ['SOURCE_BLOB']
          print('V11_PINNED_VALIDATION\tPASS')
          PY

      - name: Register exact Workbench corpus in frozen allocator
        run: |
          set -euo pipefail
          export CANDIDATE_BLOB="$(git hash-object "$CANDIDATE_PATH")"
          export CANDIDATE_SHA="$(sha256sum "$CANDIDATE_PATH" | awk '{print $1}')"
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('tools/reconciliation/allocate_rc006_a2_assertions_v1_2.py')
          text=p.read_text(encoding='utf-8')
          assert 'TOOL_VERSION = "1.2.1"' in text and 'WORKBENCH_SOURCE' not in text
          text=text.replace('TOOL_VERSION = "1.2.1"','TOOL_VERSION = "1.2.2"',1)
          needle='RFC_WFM_BATCH_ID = "A2-BATCH-0003-RFC-WFM-CONTRACT"\n'
          constants=needle+'\n'.join([
              '','WORKBENCH_SOURCE = "docs/WORKBENCH_CONTRACT.md"',
              'WORKBENCH_CANDIDATE_PATH = "docs/reconciliation/candidates/RC006_A2_WORKBENCH_CONTRACT_CANDIDATES.jsonl"',
              f'WORKBENCH_CANDIDATE_BLOB_SHA = "{os.environ["CANDIDATE_BLOB"]}"',
              f'WORKBENCH_CANDIDATE_PAYLOAD_SHA256 = "{os.environ["CANDIDATE_SHA"]}"',
              'WORKBENCH_CANDIDATE_COUNT = 211','WORKBENCH_SECTION_COUNT = 18',
              'WORKBENCH_BATCH_ID = "A2-BATCH-0004-WORKBENCH-CONTRACT"',''
          ])
          text=text.replace(needle,constants,1)
          marker='\n}\n\n\nclass FrozenAllocatorError'
          idx=text.index(marker)
          entry='\n'+'\n'.join([
              '    WORKBENCH_SOURCE: {','        "batch_id": WORKBENCH_BATCH_ID,',
              '        "candidate_path": WORKBENCH_CANDIDATE_PATH,','        "candidate_git_blob_sha": WORKBENCH_CANDIDATE_BLOB_SHA,',
              '        "candidate_payload_sha256": WORKBENCH_CANDIDATE_PAYLOAD_SHA256,','        "candidate_count": WORKBENCH_CANDIDATE_COUNT,',
              '        "section_ordinals": list(range(1, WORKBENCH_SECTION_COUNT + 1)),','    },'
          ])
          text=text[:idx]+entry+text[idx:]
          p.write_text(text,encoding='utf-8',newline='\n')
          PY
          python -m py_compile tools/reconciliation/allocate_rc006_a2_assertions_v1_2.py
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$CANDIDATE_PATH" tools/reconciliation/allocate_rc006_a2_assertions_v1_2.py
          git commit -m 'Freeze A2 Workbench candidate corpus'
          git push origin HEAD:"$BRANCH"

      - name: Validate frozen identity and preallocate exact range
        run: |
          set -euo pipefail
          python tools/reconciliation/allocate_rc006_a2_assertions_v1_2.py --repo . validate-frozen --source-path "$SOURCE_PATH" --candidates "$CANDIDATE_PATH" --output "$WORK/frozen.json"
          python tools/reconciliation/allocate_rc006_a2_assertions_v1_2.py --repo . preallocate --mode INITIAL --source-path "$SOURCE_PATH" --candidates "$CANDIDATE_PATH" --batch-id "$BATCH_ID" --output "$WORK/pre.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          w=Path(os.environ['WORK']); f=json.loads((w/'frozen.json').read_text()); p=json.loads((w/'pre.json').read_text())
          assert f['result']=='PASS' and f['candidate_count']==211 and f['section_ordinals']==list(range(1,19))
          assert p['result']=='PASS' and p['mutation_performed'] is False and p['assertion_count']==211
          assert p['first_assertion_id']=='A2-ASSERT-000825' and p['last_assertion_id']=='A2-ASSERT-001035' and p['new_allocated_count']==1035
          print('PREALLOCATION\tPASS')
          PY

      - name: Allocate Workbench assertions and verify state
        run: |
          set -euo pipefail
          python tools/reconciliation/allocate_rc006_a2_assertions_v1_2.py --repo . allocate --mode INITIAL --source-path "$SOURCE_PATH" --candidates "$CANDIDATE_PATH" --batch-id "$BATCH_ID" --output "$WORK/allocation.json" > "$WORK/stdout.json"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          w=Path(os.environ['WORK']); r=json.loads((w/'allocation.json').read_text())
          assert r['result']=='PASS' and r['mutation_performed'] is True and r['assertion_count']==211
          assert r['first_assertion_id']=='A2-ASSERT-000825' and r['last_assertion_id']=='A2-ASSERT-001035' and r['new_allocated_count']==1035
          state_raw=Path('docs/reconciliation/RC006_A2_ASSERTION_ALLOCATION_STATE.json').read_bytes(); ledger_raw=Path('docs/reconciliation/RC006_A2_ASSERTION_AUTHORITY.jsonl').read_bytes()
          assert hashlib.sha256(state_raw).hexdigest()==r['new_state_sha256']; assert hashlib.sha256(ledger_raw).hexdigest()==r['new_ledger_sha256']
          s=json.loads(state_raw); assert s['allocated_count']==1035 and s['next_assertion_number']==1036 and s['highest_allocated_assertion_id']=='A2-ASSERT-001035'
          rows=[json.loads(x) for x in ledger_raw.decode().splitlines()]; new=rows[-211:]
          assert [x['assertion_id'] for x in new]==[f'A2-ASSERT-{i:06d}' for i in range(825,1036)]
          assert all(x['source_path']=='docs/WORKBENCH_CONTRACT.md' and x['semantic_review']=='PENDING_AUTHORITY' for x in new)
          print('ALLOCATION\tPASS')
          PY

      - name: Create batch evidence and commit allocation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          w=Path(os.environ['WORK']); r=json.loads((w/'allocation.json').read_text()); g=json.loads((w/'generation.json').read_text())
          lines=['# RC-006-A2 Workbench Contract allocation batch evidence','', '**Batch:** `A2-BATCH-0004-WORKBENCH-CONTRACT`  ','**Status:** `ALLOCATED / VERIFIED`  ','**Scope:** stable-ID allocation from the completed human boundary pre-pass; authority-field population remains open.','', '## Frozen candidate identity','', f"- Source path: `{r['source_path']}`",f"- Pinned B002 source blob: `{r['pinned_source_blob_sha']}`",f"- Candidate path: `{r['candidate_path']}`",f"- Candidate Git blob: `{r['candidate_git_blob_sha']}`",f"- Candidate payload SHA-256: `{r['candidate_payload_sha256']}`",f"- Boundary-manifest SHA-256: `{os.environ['MANIFEST_SHA256']}`",f"- Exact-text sequence SHA-256: `{g['exact_text_sequence_sha256']}`",'- Candidate count: `211`','- Section ordinals: `1..18`','', '## Allocation','',f"- First assertion: `{r['first_assertion_id']}`",f"- Last assertion: `{r['last_assertion_id']}`",f"- Assertion count: `{r['assertion_count']}`",f"- New allocated count: `{r['new_allocated_count']}`",f"- Authority ledger SHA-256: `{r['new_ledger_sha256']}`",f"- Allocation state SHA-256: `{r['new_state_sha256']}`",f"- Allocator version: `{r['tool_version']}`",f"- Allocator Git blob: `{r['tool_git_blob_sha']}`",'', 'Semantic pre-pass: no Workbench contradiction; F4 and design-authority partials remain open. The 211 ledger rows remain `PENDING_AUTHORITY` until accumulated reconciliation.','']
          Path('docs/reconciliation/RC006_A2_BATCH_0004_WORKBENCH_CONTRACT.md').write_text('\n'.join(lines),encoding='utf-8',newline='\n')
          PY
          git add docs/reconciliation/RC006_A2_ASSERTION_AUTHORITY.jsonl docs/reconciliation/RC006_A2_ASSERTION_ALLOCATION_STATE.json docs/reconciliation/RC006_A2_BATCH_0004_WORKBENCH_CONTRACT.md
          git commit -m 'Allocate A2 Workbench assertions 000825-001035'
          git push origin HEAD:"$BRANCH"

      - name: Remove all temporary Workbench execution workflows
        run: |
          set -euo pipefail
          git rm -f .github/workflows/rc006-a2-freeze-allocate-workbench.yml .github/workflows/rc006-a2-workbench-manifest-diagnostic.yml .github/workflows/rc006-a2-workbench-final.yml
          git commit -m 'Remove temporary A2 Workbench allocation workflows'
          git push origin HEAD:"$BRANCH"
