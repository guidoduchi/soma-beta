name: LLD Spec Integrity

on:
  push:
    branches:
      - design/beta-1.0-hld-lld
    paths:
      - 'spec/lld/**'
      - 'tools/lld/**'
      - 'docs/DECISIONS.md'
      - '.github/workflows/lld-spec-integrity.yml'
  pull_request:
    paths:
      - 'spec/lld/**'
      - 'tools/lld/**'
      - 'docs/DECISIONS.md'
      - '.github/workflows/lld-spec-integrity.yml'
  workflow_dispatch:
    inputs:
      enforcement:
        description: Integrity enforcement level
        required: true
        default: review-ready
        type: choice
        options:
          - report
          - ai-ready
          - review-ready

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate cross-packet interface closure
        shell: bash
        run: |
          set -euo pipefail
          python tools/lld/validate_interfaces.py
          python tools/lld/validate_interface_manifests.py
      - name: Validate whole-second chronology precision
        shell: bash
        run: |
          set -euo pipefail
          python tools/lld/validate_chronology_precision.py
      - name: Validate portable backup companion set
        shell: bash
        run: |
          set -euo pipefail
          python tools/lld/validate_portable_backup_set.py
      - name: Validate password-only Local User Profile identity
        shell: bash
        run: |
          set -euo pipefail
          python tools/lld/validate_local_user_profile.py
      - name: Validate full LLD review-readiness gate
        env:
          MANUAL_ENFORCEMENT: ${{ github.event.inputs.enforcement }}
        shell: bash
        run: |
          set -euo pipefail
          mode="${MANUAL_ENFORCEMENT:-review-ready}"
          python tools/lld/final_validate_spec.py --enforce "$mode"
