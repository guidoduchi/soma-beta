name: RC006 A2 Import Contract Candidate Review

on:
  push:
    branches:
      - foundation/product-contract-v0.1
    paths:
      - '.github/workflows/rc006-a2-import-candidates-review.yml'
      - 'tools/reconciliation/prepare_rc006_a2_import_candidates.py'
      - 'tools/reconciliation/prepare_rc006_a2_import_candidates_v0_2.py'
      - 'tools/reconciliation/prepare_rc006_a2_import_candidates_v0_3.py'
      - 'tools/reconciliation/prepare_rc006_a2_import_candidates_v0_3_1.py'
      - 'tools/reconciliation/prepare_rc006_a2_import_candidates_v0_4.py'
      - 'tools/reconciliation/prepare_rc006_a2_import_candidates_v0_5.py'
      - 'tools/reconciliation/prepare_rc006_a2_import_candidates_v0_5_2.py'
      - 'tools/reconciliation/test_rc006_a2_import_v0_5_2.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Confirm allocation boundary and next source
        run: |
          set -euo pipefail
          mkdir -p /tmp/rc006-a2-import-review
          sha256sum docs/reconciliation/RC006_A2_ASSERTION_ALLOCATION_STATE.json \
            docs/reconciliation/RC006_A2_ASSERTION_AUTHORITY.jsonl \
            > /tmp/rc006-a2-import-review/allocation-before.sha256
          python tools/reconciliation/allocate_rc006_a2_assertions_v1_2.py \
            --repo . check-state \
            --output /tmp/rc006-a2-import-review/state.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/rc006-a2-import-review/state.json').read_text(encoding='utf-8'))
          assert r['result']=='PASS'
          assert r['allocated_count']==431
          assert r['ledger_record_count']==431
          assert r['next_assertion_id']=='A2-ASSERT-000432'
          assert r['next_initial_source']=='docs/IMPORT_CONTRACT.md'
          print('IMPORT_NEXT_SOURCE_BOUNDARY\tPASS')
          PY

      - name: Test review-note-only transformation and refusal paths
        run: python -m unittest discover -s tools/reconciliation -p 'test_rc006_a2_import_v0_5_2.py' -v

      - name: Generate review-note-corrected Import candidate corpus
        run: |
          set -euo pipefail
          python tools/reconciliation/prepare_rc006_a2_import_candidates_v0_5_2.py \
            --repo . \
            --output /tmp/rc006-a2-import-review/import-candidates.jsonl \
            --summary /tmp/rc006-a2-import-review/import-summary.json \
            --listing /tmp/rc006-a2-import-review/import-listing.tsv

      - name: Validate every candidate against pinned B002 source
        run: |
          set -euo pipefail
          python tools/reconciliation/allocate_rc006_a2_assertions_v1_1.py \
            --repo . validate-candidates \
            --source-path docs/IMPORT_CONTRACT.md \
            --candidates /tmp/rc006-a2-import-review/import-candidates.jsonl \
            --output /tmp/rc006-a2-import-review/validator.json

      - name: Enforce retained boundaries and explicit open semantic review
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('/tmp/rc006-a2-import-review/import-candidates.jsonl').read_text(encoding='utf-8').splitlines()]
          summary=json.loads(Path('/tmp/rc006-a2-import-review/import-summary.json').read_text(encoding='utf-8'))
          assert summary['semantic_review']=='OPEN'
          assert summary['freeze_authorized'] is False
          assert summary['allocation_authorized'] is False
          assert summary['parent_candidate_payload_sha256']=='ce0a6102cc72ef6e0ef4a00a12f0bb7ae8f15db5c7c6d12ddb301192e1663dfc'
          assert summary['changed_fields']==[{'section_ordinal':26,'assertion_ordinal':2,'field':'review_note'}]
          members=[r for r in rows if r['section_ordinal']==26]
          assert [(r['assertion_ordinal'],r['source_start_line'],r['source_end_line'],r['normative_kind']) for r in members]==[(1,256,256,'PERMISSION'),(2,258,258,'PROHIBITION')]
          assert "'It'" in members[1]['review_note'] and 'line 256' in members[1]['review_note']
          assert len(rows)==186
          assert sorted({r['section_ordinal'] for r in rows}) == [1,2,3,4,5,7,8,9,10,11,12,13,15,16,17,18,21,25,26,27,28,29]
          assert all(r['classification_review']=='PASS' for r in rows)
          assert not any('A2-ASSERT-' in json.dumps(r) for r in rows)
          checks=[
              (21,'The SOMA-generated Infrastructure workbook is not an authoritative external population. It is an operator-authored'),
              (34,'For a source family that explicitly declares authoritative-population semantics'),
              (38,'Import capture time is provenance only. It never substitutes for missing `Report Date`'),
              (41,'For RFC imports, accepting recognized terminal evidence appends that source evidence'),
              (47,"Acceptance that creates the installation's first trackable communication entity"),
              (58,'Beta 1.0 retains the SR, compact source deltas, and audit history. It does not create Alpha'),
              (94,'If an SR is marked `Customer Agreed Suspend`'),
              (114,'Every Advanced Search column not named in sections 4.1 or 4.2'),
              (176,'Both planned timestamps may be absent; such a WFM remains unscheduled. Otherwise both must be usable'),
              (252,'The workbook declares its format version, mode, source-installation scope'),
              (258,'It contains no password, private key, token, reusable secret'),
          ]
          for line,prefix in checks:
              matches=[r for r in rows if r['source_start_line']==line and r['exact_text'].startswith(prefix)]
              assert len(matches)==1, (line,prefix,len(matches))
          # Future-use field boundaries must carry the allowlist and consequence together.
          assert any(r['source_start_line']==144 and r['source_end_line']==151 and 'These fields cannot silently select' in r['exact_text'] for r in rows)
          assert any(r['source_start_line']==182 and r['source_end_line']==189 and 'These fields drive no Beta 1.0 actor assignment' in r['exact_text'] for r in rows)
          print('IMPORT_BOUNDARY_PRESERVATION\tPASS; FULL_SEMANTIC_REVIEW\tOPEN')
          PY

      - name: Record deterministic review identities
        run: |
          set -euo pipefail
          git rev-parse 61bbd665535e942ef3b05c5ed45661639d3a37a9:docs/IMPORT_CONTRACT.md > /tmp/rc006-a2-import-review/source-blob.txt
          git rev-parse HEAD:tools/reconciliation/prepare_rc006_a2_import_candidates_v0_5_2.py > /tmp/rc006-a2-import-review/generator-blob.txt
          sha256sum tools/reconciliation/prepare_rc006_a2_import_candidates_v0_5_2.py > /tmp/rc006-a2-import-review/generator-sha256.txt
          sha256sum /tmp/rc006-a2-import-review/import-candidates.jsonl > /tmp/rc006-a2-import-review/candidate-sha256.txt
          wc -l /tmp/rc006-a2-import-review/import-candidates.jsonl > /tmp/rc006-a2-import-review/candidate-count.txt
          cat /tmp/rc006-a2-import-review/import-summary.json
          cat /tmp/rc006-a2-import-review/validator.json

      - name: Recheck allocation and repository nonmutation
        if: always()
        run: |
          set -euo pipefail
          sha256sum --check /tmp/rc006-a2-import-review/allocation-before.sha256
          python tools/reconciliation/allocate_rc006_a2_assertions_v1_2.py \
            --repo . check-state --output /tmp/rc006-a2-import-review/state-after.json
          cmp /tmp/rc006-a2-import-review/state.json /tmp/rc006-a2-import-review/state-after.json
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Upload review evidence
        uses: actions/upload-artifact@v4
        with:
          name: rc006-a2-import-candidate-review-v052
          path: /tmp/rc006-a2-import-review/
          if-no-files-found: error
          retention-days: 90
