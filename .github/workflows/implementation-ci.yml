name: Beta implementation CI

on:
  push:
    branches:
      - feat/beta-1.0-implementation
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - ".gitattributes"
      - ".gitignore"
      - "MANIFEST.in"
      - ".github/workflows/implementation-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    name: UI contracts / Windows browser
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Install browser test and package environment
        shell: pwsh
        run: |
          python -m pip install -e ".[test]"
          npm --prefix src/web ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck, unit tests and reproducible offline build
        shell: pwsh
        working-directory: src/web
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- ../soma/ui/static
      - name: Verify frozen browser resources
        shell: pwsh
        run: |
          python tools/verify_ui_build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_ui_fixtures.py
      - name: Execute semantic browser scenarios
        shell: pwsh
        run: |
          Push-Location src/web
          node node_modules/@playwright/test/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SOMA_TEST_BROWSER = node --input-type=module -e "import {chromium} from 'playwright'; process.stdout.write(chromium.executablePath())"
          Pop-Location
          python tools/run_ui_browser_tests.py

  tests:
    name: Python ${{ matrix.python-version }} / Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test environment
        shell: pwsh
        run: python -m pip install -e ".[test]"
      - name: Verify private local sample exclusion
        shell: pwsh
        run: python tools/check_local_only.py
      - name: Compile package
        shell: pwsh
        run: python -m compileall -q src tests
      - name: Verify Communications scenario bindings
        shell: pwsh
        run: python tools/check_communications_traceability.py
      - name: Run complete implementation test suite
        shell: pwsh
        run: python -m pytest
      - name: Build wheel
        shell: pwsh
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Verify packaged authority resources
        shell: pwsh
        run: python tools/verify_wheel_resources.py dist

  posix-compatibility:
    name: Python 3.14 / Ubuntu compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test environment
        run: python -m pip install -e ".[test]"
      - name: Verify private local sample exclusion
        run: python tools/check_local_only.py
      - name: Verify release schema manifest
        run: python tools/generate_schema_manifest.py --check src/soma/schema_manifest.json
      - name: Verify Communications scenario bindings
        run: python tools/check_communications_traceability.py
      - name: Emit pre-LLD-08 acceptance marker coverage
        run: |
          git fetch --no-tags --depth=1 origin 46c836ca949cebcf52ff05be4eb4799e0c74eed1
          test "$(git rev-parse FETCH_HEAD)" = "46c836ca949cebcf52ff05be4eb4799e0c74eed1"
          python tools/acceptance_marker_coverage.py --design-ref FETCH_HEAD --json
      - name: Compile package
        run: python -m compileall -q src tests
      - name: Run complete implementation test suite
        run: python -m pytest
