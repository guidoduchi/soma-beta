name: Beta implementation CI

on:
  push:
    branches:
      - feat/beta-1.0-implementation
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - ".gitattributes"
      - ".github/workflows/implementation-ci.yml"

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test environment
        shell: pwsh
        run: python -m pip install -e ".[test]"
      - name: Compile package
        shell: pwsh
        run: python -m compileall -q src tests
      - name: Run complete implementation test suite
        shell: pwsh
        run: python -m pytest
      - name: Build wheel
        shell: pwsh
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Verify packaged authority resources
        shell: pwsh
        run: python tools/verify_wheel_resources.py dist
