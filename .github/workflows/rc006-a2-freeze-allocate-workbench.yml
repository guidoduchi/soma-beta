name: RC006 A2 Freeze and Allocate Workbench

on:
  push:
    branches:
      - foundation/product-contract-v0.1
    paths:
      - '.github/workflows/rc006-a2-freeze-allocate-workbench.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-allocate:
    runs-on: ubuntu-latest
    env:
      BRANCH: foundation/product-contract-v0.1
      SOURCE_COMMIT: 61bbd665535e942ef3b05c5ed45661639d3a37a9
      SOURCE_PATH: docs/WORKBENCH_CONTRACT.md
      SOURCE_BLOB: e11bc69e60853c41123a4cafd667251bc8fe2340
      CANDIDATE_PATH: docs/reconciliation/candidates/RC006_A2_WORKBENCH_CONTRACT_CANDIDATES.jsonl
      BATCH_ID: A2-BATCH-0004-WORKBENCH-CONTRACT
      WORK: /tmp/rc006-a2-workbench
      MANIFEST_B64:   
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify allocation frontier and pinned source
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          test "$(git rev-parse "$SOURCE_COMMIT:$SOURCE_PATH")" = "$SOURCE_BLOB"
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('docs/reconciliation/RC006_A2_ASSERTION_ALLOCATION_STATE.json').read_text())
          assert s['allocated_count']==824, s
          assert s['next_assertion_number']==825, s
          assert s['highest_allocated_assertion_id']=='A2-ASSERT-000824', s
          assert s['completed_initial_sources']==[
              'docs/PRODUCT_CONTRACT.md',
              'docs/IMPORT_CONTRACT.md',
              'docs/RFC_WFM_CONTRACT.md',
          ], s
          print('FRONTIER\tPASS')
          PY
          test ! -e "$CANDIDATE_PATH"

      - name: Generate human-reviewed Workbench candidate corpus
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, re, subprocess, unicodedata
          from pathlib import Path

          source_commit=os.environ['SOURCE_COMMIT']
          source_path=os.environ['SOURCE_PATH']
          source_blob=os.environ['SOURCE_BLOB']
          candidate_path=Path(os.environ['CANDIDATE_PATH'])
          manifest=json.loads(base64.b64decode(os.environ['MANIFEST_B64']).decode('utf-8'))
          assert len(manifest)==211

          resolved=subprocess.check_output(['git','rev-parse',f'{source_commit}:{source_path}'],text=True).strip()
          assert resolved==source_blob,(resolved,source_blob)
          raw=subprocess.check_output(['git','show',f'{source_commit}:{source_path}'])
          assert b'\r' not in raw
          text=raw.decode('utf-8')
          lines=text.splitlines()
          assert len(lines)==203,len(lines)

          headings=[]
          for line_no,line in enumerate(lines,start=1):
              m=re.match(r'^(#{2,3})\s+(.+?)\s*$',line)
              if m:
                  visible=m.group(2)
                  anchor=unicodedata.normalize('NFC',visible)
                  anchor=anchor.replace('`','').replace('*','').replace('_','').lower()
                  anchor=''.join(ch for ch in anchor if ch.isalnum() or ch in {' ','-'})
                  anchor=re.sub(r' +','-',anchor)
                  anchor=re.sub(r'-+','-',anchor).strip('-')
                  headings.append((line_no,visible,anchor))
          assert len(headings)==18,headings

          def owner(start):
              eligible=[h for h in headings if h[0] < start]
              assert eligible
              h=eligible[-1]
              return h[1],h[2],headings.index(h)+1

          def fingerprint(value):
              norm=unicodedata.normalize('NFC',value.replace('\r\n','\n').replace('\r','\n'))
              return hashlib.sha256(norm.encode('utf-8')).hexdigest()

          per_section={}
          records=[]
          for item in manifest:
              start=int(item['start']); end=int(item['end']); exact=item['text']; kind=item['kind']
              assert 1 <= start <= end <= len(lines),(start,end)
              segment='\n'.join(lines[start-1:end])
              assert segment.count(exact)==1,(start,end,exact,segment)
              offset=segment.index(exact)
              assert '\n' not in segment[:offset],(start,exact)
              assert start+exact.count('\n')==end,(start,end,exact)
              heading,anchor,section_ordinal=owner(start)
              assertion_ordinal=per_section.get(section_ordinal,0)+1
              per_section[section_ordinal]=assertion_ordinal
              assert kind in {'OBLIGATION','PROHIBITION','PERMISSION','DESIGN_BOUNDARY'}
              records.append({
                  'schema':'RC006-A2-ASSERTION-CANDIDATE-V1',
                  'source_path':source_path,
                  'source_blob_sha':source_blob,
                  'section_heading':heading,
                  'section_anchor':anchor,
                  'section_ordinal':section_ordinal,
                  'assertion_ordinal':assertion_ordinal,
                  'source_start_line':start,
                  'source_end_line':end,
                  'exact_text':exact,
                  'fingerprint_sha256':fingerprint(exact),
                  'normative_kind':kind,
                  'classification_review':'PASS',
                  'review_note':'Human boundary review 2026-09-05: retained as one independently reviewable rule or cohesive presentation/behavior contract. Reverse authority disposition tracked by the completed A2 semantic pre-pass.',
              })

          assert sorted(per_section)==list(range(1,19)),per_section
          assert sum(per_section.values())==211
          # Expected section candidate totals freeze the reviewed boundary set.
          expected={}
          for r in records:
              expected[r['section_ordinal']]=expected.get(r['section_ordinal'],0)+1
          # Canonical JSONL.
          rendered=b''.join(
              (json.dumps(r,sort_keys=True,separators=(',',':'),ensure_ascii=False)+'\n').encode('utf-8')
              for r in records
          )
          candidate_path.parent.mkdir(parents=True,exist_ok=True)
          candidate_path.write_bytes(rendered)

          exact_sequence='\n'.join(r['exact_text'] for r in records).encode('utf-8')
          report={
              'candidate_count':len(records),
              'section_counts':expected,
              'candidate_sha256':hashlib.sha256(rendered).hexdigest(),
              'exact_text_sequence_sha256':hashlib.sha256(exact_sequence).hexdigest(),
          }
          Path(os.environ['WORK'],'generation.json').write_text(
              json.dumps(report,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8'
          )
          print(json.dumps(report,sort_keys=True))
          PY

      - name: Validate candidate against pinned B002 source
        run: |
          set -euo pipefail
          python tools/reconciliation/allocate_rc006_a2_assertions_v1_1.py --repo . validate-candidates \
            --source-path "$SOURCE_PATH" --candidates "$CANDIDATE_PATH" --output "$WORK/v11-validation.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path(os.environ['WORK'],'v11-validation.json').read_text())
          assert r['result']=='PASS'
          assert r['candidate_count']==211
          assert r['section_count_with_candidates']==18
          assert r['pinned_source_blob_sha']==os.environ['SOURCE_BLOB']
          print('PINNED_VALIDATION\tPASS')
          PY

      - name: Register exact Workbench frozen identity in allocator V1.2
        run: |
          set -euo pipefail
          CANDIDATE_BLOB="$(git hash-object "$CANDIDATE_PATH")"
          CANDIDATE_SHA="$(sha256sum "$CANDIDATE_PATH" | awk '{print $1}')"
          export CANDIDATE_BLOB CANDIDATE_SHA
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('tools/reconciliation/allocate_rc006_a2_assertions_v1_2.py')
          text=p.read_text(encoding='utf-8')
          assert 'TOOL_VERSION = "1.2.1"' in text
          assert 'WORKBENCH_SOURCE' not in text
          text=text.replace('TOOL_VERSION = "1.2.1"','TOOL_VERSION = "1.2.2"',1)

          needle='RFC_WFM_BATCH_ID = "A2-BATCH-0003-RFC-WFM-CONTRACT"\n'
          assert needle in text
          constants = needle + '\n'.join([
              'WORKBENCH_SOURCE = "docs/WORKBENCH_CONTRACT.md"',
              'WORKBENCH_CANDIDATE_PATH = "docs/reconciliation/candidates/RC006_A2_WORKBENCH_CONTRACT_CANDIDATES.jsonl"',
              f'WORKBENCH_CANDIDATE_BLOB_SHA = "{os.environ["CANDIDATE_BLOB"]}"',
              f'WORKBENCH_CANDIDATE_PAYLOAD_SHA256 = "{os.environ["CANDIDATE_SHA"]}"',
              'WORKBENCH_CANDIDATE_COUNT = 211',
              'WORKBENCH_SECTION_COUNT = 18',
              'WORKBENCH_BATCH_ID = "A2-BATCH-0004-WORKBENCH-CONTRACT"',
              '',
          ]) + '\n'
          text=text.replace(needle,constants,1)
          marker='\n}\n\n\nclass FrozenAllocatorError'
          idx=text.index(marker)
          entry='\n' + '\n'.join([
              '    WORKBENCH_SOURCE: {',
              '        "batch_id": WORKBENCH_BATCH_ID,',
              '        "candidate_path": WORKBENCH_CANDIDATE_PATH,',
              '        "candidate_git_blob_sha": WORKBENCH_CANDIDATE_BLOB_SHA,',
              '        "candidate_payload_sha256": WORKBENCH_CANDIDATE_PAYLOAD_SHA256,',
              '        "candidate_count": WORKBENCH_CANDIDATE_COUNT,',
              '        "section_ordinals": list(range(1, WORKBENCH_SECTION_COUNT + 1)),',
              '    },',
          ])
          text=text[:idx]+entry+text[idx:]
          p.write_text(text,encoding='utf-8',newline='\n')
          PY
          python -m py_compile tools/reconciliation/allocate_rc006_a2_assertions_v1_2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$CANDIDATE_PATH" tools/reconciliation/allocate_rc006_a2_assertions_v1_2.py
          git commit -m 'Freeze A2 Workbench candidate corpus'
          git push origin HEAD:"$BRANCH"

      - name: Validate frozen identity and preallocate exact range
        run: |
          set -euo pipefail
          python tools/reconciliation/allocate_rc006_a2_assertions_v1_2.py --repo . validate-frozen \
            --source-path "$SOURCE_PATH" --candidates "$CANDIDATE_PATH" --output "$WORK/frozen.json"
          python tools/reconciliation/allocate_rc006_a2_assertions_v1_2.py --repo . preallocate \
            --mode INITIAL --source-path "$SOURCE_PATH" --candidates "$CANDIDATE_PATH" \
            --batch-id "$BATCH_ID" --output "$WORK/preallocation.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          work=Path(os.environ['WORK'])
          f=json.loads((work/'frozen.json').read_text())
          p=json.loads((work/'preallocation.json').read_text())
          assert f['result']=='PASS' and f['candidate_count']==211 and f['section_ordinals']==list(range(1,19))
          assert p['result']=='PASS' and p['mutation_performed'] is False
          assert p['assertion_count']==211
          assert p['first_assertion_id']=='A2-ASSERT-000825'
          assert p['last_assertion_id']=='A2-ASSERT-001035'
          assert p['new_allocated_count']==1035
          assert p['candidate_payload_sha256']==f['candidate_payload_sha256']
          print('WORKBENCH_PREALLOCATION\tPASS')
          PY

      - name: Allocate Workbench assertions
        run: |
          set -euo pipefail
          python tools/reconciliation/allocate_rc006_a2_assertions_v1_2.py --repo . allocate \
            --mode INITIAL --source-path "$SOURCE_PATH" --candidates "$CANDIDATE_PATH" \
            --batch-id "$BATCH_ID" --output "$WORK/allocation.json" > "$WORK/allocation.stdout.json"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          work=Path(os.environ['WORK'])
          r=json.loads((work/'allocation.json').read_text())
          assert r['result']=='PASS' and r['mutation_performed'] is True
          assert r['assertion_count']==211
          assert r['first_assertion_id']=='A2-ASSERT-000825'
          assert r['last_assertion_id']=='A2-ASSERT-001035'
          assert r['new_allocated_count']==1035
          state_raw=Path('docs/reconciliation/RC006_A2_ASSERTION_ALLOCATION_STATE.json').read_bytes()
          ledger_raw=Path('docs/reconciliation/RC006_A2_ASSERTION_AUTHORITY.jsonl').read_bytes()
          assert hashlib.sha256(state_raw).hexdigest()==r['new_state_sha256']
          assert hashlib.sha256(ledger_raw).hexdigest()==r['new_ledger_sha256']
          state=json.loads(state_raw)
          assert state['allocated_count']==1035 and state['next_assertion_number']==1036
          assert state['highest_allocated_assertion_id']=='A2-ASSERT-001035'
          assert state['completed_initial_sources'][-1]=='docs/WORKBENCH_CONTRACT.md'
          rows=[json.loads(x) for x in ledger_raw.decode('utf-8').splitlines()]
          new=rows[-211:]
          assert [x['assertion_id'] for x in new]==[f'A2-ASSERT-{i:06d}' for i in range(825,1036)]
          assert all(x['source_path']=='docs/WORKBENCH_CONTRACT.md' for x in new)
          assert all(x['semantic_review']=='PENDING_AUTHORITY' for x in new)
          print('WORKBENCH_ALLOCATION\tPASS')
          PY

      - name: Create batch evidence and commit allocation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          work=Path(os.environ['WORK'])
          r=json.loads((work/'allocation.json').read_text())
          g=json.loads((work/'generation.json').read_text())
          lines=[
              '# RC-006-A2 Workbench Contract allocation batch evidence','',
              '**Batch:** `A2-BATCH-0004-WORKBENCH-CONTRACT`  ',
              '**Status:** `ALLOCATED / VERIFIED`  ',
              '**Scope:** stable-ID allocation from the completed human boundary pre-pass; authority-field population remains open.','',
              '## Frozen candidate identity','',
              f"- Source path: `{r['source_path']}`",
              f"- Pinned B002 source blob: `{r['pinned_source_blob_sha']}`",
              f"- Candidate path: `{r['candidate_path']}`",
              f"- Candidate Git blob: `{r['candidate_git_blob_sha']}`",
              f"- Candidate payload SHA-256: `{r['candidate_payload_sha256']}`",
              f"- Exact-text sequence SHA-256: `{g['exact_text_sequence_sha256']}`",
              f"- Candidate count: `{r['candidate_count']}`",
              '- Section ordinals: `1..18`','',
              '## Allocation','',
              f"- First assertion: `{r['first_assertion_id']}`",
              f"- Last assertion: `{r['last_assertion_id']}`",
              f"- Assertion count: `{r['assertion_count']}`",
              f"- New allocated count: `{r['new_allocated_count']}`",
              f"- Authority ledger SHA-256: `{r['new_ledger_sha256']}`",
              f"- Allocation state SHA-256: `{r['new_state_sha256']}`",
              f"- Allocator version: `{r['tool_version']}`",
              f"- Allocator Git blob: `{r['tool_git_blob_sha']}`",'',
              'The semantic pre-pass found no Workbench contradiction, but F4 and several design-authority partials remain open. These 211 ledger rows therefore remain `PENDING_AUTHORITY` until accumulated reverse-authority reconciliation.',''
          ]
          Path('docs/reconciliation/RC006_A2_BATCH_0004_WORKBENCH_CONTRACT.md').write_text(
              '\n'.join(lines),encoding='utf-8',newline='\n'
          )
          PY
          git add docs/reconciliation/RC006_A2_ASSERTION_AUTHORITY.jsonl \
                  docs/reconciliation/RC006_A2_ASSERTION_ALLOCATION_STATE.json \
                  docs/reconciliation/RC006_A2_BATCH_0004_WORKBENCH_CONTRACT.md
          python - <<'PY'
          import subprocess
          expected={
              'docs/reconciliation/RC006_A2_ASSERTION_AUTHORITY.jsonl',
              'docs/reconciliation/RC006_A2_ASSERTION_ALLOCATION_STATE.json',
              'docs/reconciliation/RC006_A2_BATCH_0004_WORKBENCH_CONTRACT.md',
          }
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert staged==expected,(staged,expected)
          PY
          git commit -m 'Allocate A2 Workbench assertions 000825-001035'
          git push origin HEAD:"$BRANCH"

      - name: Remove temporary execution workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/rc006-a2-freeze-allocate-workbench.yml
          git commit -m 'Remove temporary A2 Workbench allocation workflow'
          git push origin HEAD:"$BRANCH"
