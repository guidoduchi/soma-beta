name: RC006 A2 Workbench Manifest Diagnostic

on:
  push:
    branches:
      - foundation/product-contract-v0.1
    paths:
      - '.github/workflows/rc006-a2-workbench-manifest-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose all manifest/source mismatches
        run: |
          python - <<'PY'
          import base64,json,subprocess
          from pathlib import Path
          wf=Path('.github/workflows/rc006-a2-freeze-allocate-workbench.yml').read_text(encoding='utf-8')
          assert 'MANIFEST_B64:' in wf and 'PYTHONDONTWRITEBYTECODE:' in wf
          block=wf.split('MANIFEST_B64:',1)[1].split('PYTHONDONTWRITEBYTECODE:',1)[0]
          encoded=''.join(block.split())
          manifest=json.loads(base64.b64decode(encoded).decode('utf-8'))
          assert len(manifest)==211
          raw=subprocess.check_output(['git','show','61bbd665535e942ef3b05c5ed45661639d3a37a9:docs/WORKBENCH_CONTRACT.md'])
          lines=raw.decode('utf-8').splitlines()
          bad=[]
          for idx,item in enumerate(manifest,1):
              start=int(item['start']); end=int(item['end']); exact=item['text']
              seg='\n'.join(lines[start-1:end])
              count=seg.count(exact)
              first_line_ok = count==1 and '\n' not in seg[:seg.index(exact)]
              end_ok = start+exact.count('\n')==end
              if count!=1 or not first_line_ok or not end_ok:
                  bad.append({
                      'index':idx,'start':start,'end':end,'count':count,
                      'first_line_ok':first_line_ok,'end_ok':end_ok,
                      'exact_repr':repr(exact),'segment_repr':repr(seg),
                      'exact_codepoints':[f'U+{ord(c):04X}' for c in exact],
                  })
          print('MANIFEST_COUNT',len(manifest))
          print('MISMATCH_COUNT',len(bad))
          for x in bad:
              print('MISMATCH',json.dumps(x,ensure_ascii=False,sort_keys=True))
          assert not bad, f'{len(bad)} manifest/source mismatches'
          PY
