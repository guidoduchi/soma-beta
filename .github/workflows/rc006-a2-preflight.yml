name: RC006 A2 Preflight

on:
  push:
    branches:
      - foundation/product-contract-v0.1
    paths:
      - '.github/workflows/rc006-a2-preflight.yml'
      - 'tools/reconciliation/validate_rc006_a2_manifest.py'
      - 'docs/reconciliation/RC006_A2_INPUT_MANIFEST.tsv'
      - 'docs/reconciliation/RC006_A2_EXECUTION_BASELINE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run pinned B002 manifest validator
        run: |
          python tools/reconciliation/validate_rc006_a2_manifest.py \
            --repo . \
            --output rc006_a2_manifest_validation.txt

      - name: Show deterministic result
        run: cat rc006_a2_manifest_validation.txt

      - name: Upload deterministic result
        uses: actions/upload-artifact@v4
        with:
          name: rc006-a2-manifest-validation
          path: rc006_a2_manifest_validation.txt
          if-no-files-found: error
          retention-days: 90
